name: Fialda VIP Expert Scanner & GitHub Pages Deploy

on:
  schedule:
    # =========================================================================
    # LỊCH QUÉT TỰ ĐỘNG ĐỊNH KỲ 30 PHÚT/LẦN TRONG GIỜ GIAO DỊCH (THỨ 2 - THỨ 6)
    # Giờ Việt Nam (UTC+7) = Giờ UTC + 7 tiếng
    # =========================================================================
    # --- PHIÊN SÁNG (09:00 - 11:30 VN <=> 02:00 - 04:30 UTC) ---
    - cron: '15 2 * * 1-5'  # 09:15 VN -> 02:15 UTC (Sau phiên ATO mở cửa)
    - cron: '45 2 * * 1-5'  # 09:45 VN -> 02:45 UTC (Sóng bùng nổ đầu phiên)
    - cron: '15 3 * * 1-5'  # 10:15 VN -> 03:15 UTC (Nhịp rung lắc kiểm định)
    - cron: '45 3 * * 1-5'  # 10:45 VN -> 03:45 UTC (Điểm cân bằng phiên sáng)
    - cron: '15 4 * * 1-5'  # 11:15 VN -> 04:15 UTC (Áp lực chốt lời trước giờ trưa)
    - cron: '45 4 * * 1-5'  # 11:45 VN -> 04:45 UTC (Chốt phiên sáng toàn diện)

    # --- PHIÊN CHIỀU (13:00 - 15:00 VN <=> 06:00 - 08:00 UTC) ---
    - cron: '15 6 * * 1-5'  # 13:15 VN -> 06:15 UTC (Mở phiên chiều & Hấp thụ tin tức trưa)
    - cron: '45 6 * * 1-5'  # 13:45 VN -> 06:45 UTC (Bắt đầu áp lực hàng T+2.5 về tài khoản)
    - cron: '15 7 * * 1-5'  # 14:15 VN -> 07:15 UTC (Giờ vàng T+2.5 & Big Boy chuẩn bị ATC)
    - cron: '45 7 * * 1-5'  # 14:45 VN -> 07:45 UTC (Đang khớp lệnh ATC)
    - cron: '5 8 * * 1-5'   # 15:05 VN -> 08:05 UTC (Chốt phiên đóng cửa ATC chính thức)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/**'
      - 'requirements.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    name: Scan Top 5 & Deploy Dashboard
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fialda VIP Expert Scanner & Generate Terminal HTML
        env:
          FIALDA_USERNAME: ${{ secrets.FIALDA_USERNAME }}
          FIALDA_PASSWORD: ${{ secrets.FIALDA_PASSWORD }}
        run: |
          mkdir -p exports reports
          python -m src.collector.fialda_scanner --save-report reports/latest_scan.md --generate-terminal

      - name: Copy 404 and nojekyll for GitHub Pages
        run: |
          if [ -f exports/index.html ]; then
            cp exports/index.html exports/404.html
          fi
          touch exports/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./exports
          keep_files: false

      - name: Setup GitHub Pages (Actions Mode)
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages Artifact (Actions Mode)
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: 'exports/'

      - name: Deploy to GitHub Pages (Actions Mode)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Commit Latest Scan Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/latest_scan.md || true
          if git diff --staged --quiet; then
            echo "No changes in latest_scan.md to commit."
          else
            git commit -m "chore(report): auto-update Top 5 Super Stocks scan [skip ci]"
            git push origin main
          fi

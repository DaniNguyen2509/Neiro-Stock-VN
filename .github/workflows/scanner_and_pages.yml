name: Fialda VIP Expert Scanner & GitHub Pages Deploy

on:
  schedule:
    # =========================================================================
    # LỊCH QUÉT TỰ ĐỘNG ĐỊNH KỲ TRONG GIỜ GIAO DỊCH (THỨ 2 - THỨ 6)
    # Giờ Việt Nam (UTC+7) = Giờ UTC + 7 tiếng
    # Tối ưu dùng phút lệch (:18, :48, :08, :35) để tránh nghẽn tải hàng loạt bot trên GitHub Scheduler
    # =========================================================================
    # Phiên sáng: 09:18, 09:48, 10:18, 10:48, 11:18, 11:48 VN <=> 02:18, 02:48, 03:18, 03:48, 04:18, 04:48 UTC
    - cron: '18,48 2,3,4 * * 1-5'
    # Phiên chiều: 13:18, 13:48, 14:18, 14:48 VN <=> 06:18, 06:48, 07:18, 07:48 UTC
    - cron: '18,48 6,7 * * 1-5'
    # Chốt phiên ATC: 15:08 VN <=> 08:08 UTC
    - cron: '8 8 * * 1-5'
    # Chốt Tự doanh & Khối ngoại chiều: 17:35 VN <=> 10:35 UTC
    - cron: '35 10 * * 1-5'
    # Chốt sổ toàn diện buổi tối (EOD Final Smart Money): 19:08 VN <=> 12:08 UTC
    - cron: '8 12 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [external_scan, fialda_scan]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/**'
      - 'requirements.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'scanner'
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    name: Scan Top 5 & Deploy Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fialda VIP Expert Scanner & Generate Terminal HTML
        env:
          FIALDA_USERNAME: ${{ secrets.FIALDA_USERNAME }}
          FIALDA_PASSWORD: ${{ secrets.FIALDA_PASSWORD }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: |
          mkdir -p exports reports data
          python -m src.collector.fialda_scanner --save-report reports/latest_scan.md --generate-terminal
          if [ -f data/advisory_scorecard.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat data/advisory_scorecard.md >> $GITHUB_STEP_SUMMARY
          elif [ -f reports/latest_scan.md ]; then
            cat reports/latest_scan.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Copy 404 and nojekyll for GitHub Pages
        run: |
          if [ -f exports/index.html ]; then
            cp exports/index.html exports/404.html
          fi
          touch exports/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./exports
          keep_files: false


      - name: Commit Latest Scan Report & Signal Ledger
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/latest_scan.md data/ranking_history.jsonl data/active_signals.jsonl data/advisory_scorecard.md data/ml_signals_dataset.csv exports/index.html exports/404.html || true
          if git diff --staged --quiet; then
            echo "No changes in reports/data to commit."
          else
            git commit -m "chore(report): auto-update Top 5 Super Stocks, signal ledger and ML dataset [skip ci]"
            git push origin main
          fi

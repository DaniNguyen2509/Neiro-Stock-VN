[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neiro-stock-vn"
version = "1.0.0"
description = "Quantitative & Fundamental Trading System for Vietnam Stock Market"
authors = [{ name = "Neiro Quant Team" }]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
